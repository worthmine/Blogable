<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blogable Parser v1.1-alpha</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia,'Noto Serif JP',serif; background:#0f0f0f; color:#e8e4d9; height:100vh; display:flex; flex-direction:column; }
header { border-bottom:1px solid #222; padding:14px 24px; display:flex; align-items:baseline; gap:12px; flex-shrink:0; }
.logo    { font-family:monospace; font-size:20px; font-weight:bold; color:#c8b87a; letter-spacing:2px; }
.version { font-size:11px; color:#555; font-family:monospace; }
#ogp-status { font-size:10px; color:#5a8a5a; font-family:monospace; display:none; }
.main { display:grid; grid-template-columns:1fr 1fr; flex:1; overflow:hidden; }
.pane { display:flex; flex-direction:column; overflow:hidden; }
.pane-left { border-right:1px solid #222; }
.pane-label { padding:6px 16px; background:#0a0a0a; border-bottom:1px solid #1a1a1a; font-size:10px; color:#444; font-family:monospace; letter-spacing:1px; flex-shrink:0; }
#source { flex:1; background:#0a0a0a; color:#b8c4a0; border:none; outline:none; padding:20px; font-family:'Fira Code','Courier New',monospace; font-size:12.5px; line-height:1.85; resize:none; tab-size:2; }
.tabs { display:flex; background:#0a0a0a; border-bottom:1px solid #1a1a1a; flex-shrink:0; }
.tab-btn { padding:6px 20px; background:none; border:none; border-bottom:2px solid transparent; color:#555; font-size:10px; font-family:monospace; cursor:pointer; text-transform:uppercase; letter-spacing:1px; }
.tab-btn.active { border-bottom-color:#c8b87a; color:#c8b87a; }
.output { flex:1; overflow:auto; padding:24px; }
#html-out { font-family:'Fira Code',monospace; font-size:12px; color:#7a9a7a; white-space:pre-wrap; word-break:break-all; }

/* –– Preview .bp –– */
.bp h2,.bp h3,.bp h4,.bp h5,.bp h6 { color:#c8b87a; font-weight:normal; margin:1.4em 0 .4em; line-height:1.4; }
.bp h2 { font-size:1.5em; border-bottom:1px solid #222; padding-bottom:.3em; }
.bp h3 { font-size:1.25em; } .bp h4 { font-size:1.1em; }
.bp ul,.bp ol { padding-left:1.5em; margin:.5em 0; } .bp li { margin:.3em 0; }
.bp li.task-item { list-style:none; margin-left:-1em; }
.bp li.task-item input { margin-right:.5em; accent-color:#c8b87a; }
.bp dl { margin:.8em 0; }
.bp dt { color:#c8b87a; font-weight:bold; margin-top:.8em; }
.bp dd { margin-left:1.5em; color:#a0a09a; }
.bp dd p { margin:.3em 0; }
.bp blockquote { border-left:3px solid #c8b87a; margin:.8em 0; padding:.6em 1.2em; color:#aaa; font-style:italic; }
.bp blockquote p { margin:.4em 0; }
.bp blockquote footer { margin-top:.6em; font-size:.85em; font-style:normal; color:#666; }
.bp blockquote footer cite { color:#888; }
.bp blockquote footer .author { color:#777; }
.bp hr { border:none; border-top:1px solid #222; margin:1.5em 0; }
.bp code { background:#1a1a1a; color:#8ab87a; padding:.1em .4em; border-radius:3px; font-family:monospace; font-size:.9em; }
.bp strong { color:#e8e4d9; }
.bp em { color:#c8c4b9; }
.bp a { color:#7a9ab8; text-decoration:none; border-bottom:1px solid #2a4a5a; }
.bp a:hover { border-bottom-color:#7a9ab8; }
.bp p { margin:.6em 0; }
.bp p.lead { font-size:1.1em; color:#c8b87a; }
.bp p.note { border-left:2px solid #555; padding-left:.8em; color:#aaa; font-size:.95em; }
.bp ins { background:#1a3a1a; color:#8ab87a; text-decoration:underline; padding:0 2px; border-radius:2px; }
.bp del { background:#3a1a1a; color:#a87a7a; text-decoration:line-through; padding:0 2px; border-radius:2px; }
.bp figure.blogable-figure { margin:1em 0; }
.bp figure.blogable-figure img { max-width:100%; border-radius:4px; display:block; margin-bottom:4px; }
.bp figure.blogable-figure figcaption { font-size:.85em; color:#888; margin-top:.3em; }
.bp figure.blogable-figure cite { font-size:.8em; color:#555; }
.bp sup a { color:#c8b87a; font-size:.75em; border-bottom:none; }

/* フロントマター */
.bp .front-matter { border:1px solid #2a2a2a; border-radius:6px; padding:12px 16px; margin-bottom:1.5em; font-family:monospace; font-size:12px; }
.bp .front-matter dt { color:#888; margin-top:.4em; font-weight:normal; }
.bp .front-matter dd { color:#b8c4a0; margin-left:1em; }

/* 数式ブロック */
.bp .math-block { background:#111; border:1px solid #222; border-radius:6px; padding:12px 16px; margin:1em 0; font-family:monospace; font-size:13px; color:#a0a8c0; white-space:pre; overflow-x:auto; }

/* 内部アンカー */
.bp .anchor-block { display:inline-block; color:#555; font-size:.8em; font-family:monospace; }
.bp a.anchor-ref { color:#888; border-bottom:1px dotted #444; font-size:.9em; }

/* 定義ブロック := */
.bp .def-block { margin:.8em 0; display:grid; grid-template-columns:auto 1fr; gap:.3em 1.2em; align-items:start; }
.bp .def-block dt { color:#c8b87a; font-weight:bold; white-space:nowrap; padding-top:.1em; }
.bp .def-block dt::after { content:” :=”; color:#555; font-weight:normal; }
.bp .def-block dd { color:#a0a09a; margin:0; }
.bp .def-block dd p { margin:.2em 0; }

/* 連番見出し */
.bp { counter-reset:h2; }
.bp h2.numbered { counter-reset:h3; counter-increment:h2; }
.bp h2.numbered::before { content:counter(h2) “. “; }
.bp h3.numbered { counter-reset:h4; counter-increment:h3; }
.bp h3.numbered::before { content:counter(h2) “.” counter(h3) “. “; }
.bp h4.numbered { counter-reset:h5; counter-increment:h4; }
.bp h4.numbered::before { content:counter(h2) “.” counter(h3) “.” counter(h4) “. “; }

/* 脚注 */
.bp .blogable-footnotes { margin-top:2em; padding-top:1em; border-top:1px solid #222; font-size:.85em; color:#888; }
.bp .blogable-footnotes ol { padding-left:1.5em; }
.bp .blogable-footnotes li { margin:.4em 0; }
.bp .blogable-footnotes a { color:#7a9ab8; border-bottom:none; }
.bp .blogable-footnotes .fn-back { color:#555; margin-left:.4em; }
.bp .blogable-footnotes .fn-alt  { color:#666; margin-left:.3em; }

/* コードブロック */
.blogable-code { background:#111; border:1px solid #222; border-radius:6px; overflow:hidden; margin:1em 0; }
.blogable-code figcaption { padding:6px 14px; background:#1a1a1a; font-size:12px; color:#888; display:flex; justify-content:space-between; align-items:center; font-style:normal; }
.lang-badge { font-size:10px; color:#555; text-transform:uppercase; letter-spacing:1px; }
.code-area { position:relative; }
.copy-all-btn { position:absolute; top:8px; right:10px; background:#1e1e1e; border:1px solid #333; border-radius:4px; color:#666; font-size:10px; padding:3px 8px; cursor:pointer; font-family:monospace; letter-spacing:.5px; transition:all .15s; z-index:1; }
.copy-all-btn:hover { color:#aaa; } .copy-all-btn.copied { background:#2a4a2a; color:#8ab87a; }
.code-table { border-collapse:collapse; width:100%; padding:10px 0; display:table; }
.code-row { cursor:pointer; }
.code-row:hover td.code-cell { background:#161a16; }
.line-num { padding:1px 12px 1px 16px; text-align:right; user-select:none; font-size:11px; min-width:32px; vertical-align:top; color:#444; transition:color .15s; }
.line-num.shebang { color:#3a5a3a; } .line-num.copied { color:#8ab87a; }
.code-cell { padding:1px 40px 1px 8px; font-size:13px; color:#8ab87a; width:100%; white-space:pre; transition:all .15s; }
.code-cell.shebang { color:#5a8a5a; } .code-cell.copied { color:#aad4aa; background:#1a2a1a; }
.blogable-code cite { display:block; padding:5px 14px; font-size:11px; color:#555; border-top:1px solid #1e1e1e; font-style:normal; }
.blogable-code cite a { color:#557a55; border-bottom:none; }
.blogable-code pre[class*=“language-”] { margin:0; padding:0; background:transparent; }
.blogable-code code[class*=“language-”] { background:transparent; font-size:13px; }

/* Prism: blogable言語 */
.language-blogable .token.comment     { color:#5a9a5a; font-style:normal; }
.language-blogable .token.keyword     { color:#5a9a5a; }
.language-blogable .token.punctuation { color:#666; }
.language-blogable .token.string      { color:#8a7ab8; }
.language-blogable .token.attr-name   { color:#e8a07a; }
.language-blogable .token.attr-value  { color:#d4c090; }
.language-blogable .token.bold        { color:#e8e4d9; font-weight:bold; }
.language-blogable .token.variable    { color:#7ab8c8; }
.language-blogable .token.inserted    { color:#6a9a6a; }
.language-blogable .token.deleted     { color:#a87a7a; }
.language-blogable .token.url         { color:#7a9ab8; text-decoration:underline; }
.language-blogable .token.symbol      { color:#c8b87a; }
.language-blogable .token.code        { color:#8ab87a; }

::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:#0a0a0a; }
::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:3px; }
</style>

</head>
<body>
<header>
  <span class="logo">Blogable</span>
  <span class="version">parser v1.1-alpha</span>
  <span id="ogp-status"></span>
</header>
<div class="main">
  <div class="pane pane-left">
    <div class="pane-label">SOURCE</div>
    <textarea id="source" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('preview',this)">PREVIEW</button>
      <button class="tab-btn"        onclick="switchTab('html',this)">HTML</button>
    </div>
    <div class="output">
      <div id="preview-out" class="bp" style="line-height:1.9;font-size:15px;"></div>
      <pre id="html-out" style="display:none"></pre>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ruby.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-php.min.js"></script>

<script>
// ============================================================
// Prism: blogable カスタム言語
// ============================================================
Prism.languages.blogable = {
  'shebang':       { pattern:/^#!.+$/m,            alias:'comment' },
  'shebang-close': { pattern:/^!#$/m,               alias:'keyword' },
  'front-fence':   { pattern:/^@@$/m,               alias:'keyword' },
  'math-fence':    { pattern:/^\$\$$/m,             alias:'keyword' },
  'hr':            { pattern:/^---$/m,              alias:'punctuation' },
  'quote-fence':   { pattern:/^\|>$|^<\|$/m,        alias:'string' },
  'modifier': {
    pattern:/^@\[[a-z][a-z0-9-]*:.*\]$/m,
    inside:{
      'modifier-bracket':{ pattern:/^@\[|\]$/,                  alias:'punctuation' },
      'modifier-key':    { pattern:/(?<=^@\[)[a-z][a-z0-9-]*/, alias:'attr-name' },
      'modifier-sep':    { pattern:/:\s*/,                      alias:'punctuation' },
      'modifier-value':  { pattern:/.+(?=\]$)/,                 alias:'attr-value' },
    }
  },
  'def-block':     { pattern:/^:=\s+.+$/m,          alias:'variable' },
  'heading-numbered':{ pattern:/^:{2,6}#.+$/m, inside:{ 'hm':{ pattern:/^:{2,6}#/, alias:'punctuation' }, 'ht':{ pattern:/.+/, alias:'bold' } } },
  'heading':         { pattern:/^:{2,6} .+$/m, inside:{ 'hm':{ pattern:/^:{2,6}/, alias:'punctuation' }, 'ht':{ pattern:/.+/, alias:'bold' } } },
  'bq-inline':     { pattern:/^> .+$/m,             alias:'string' },
  'task-done':     { pattern:/^[#-] \[x\] .+$/mi,   alias:'inserted' },
  'task-open':     { pattern:/^[#-] \[ \] .+$/m,    alias:'punctuation' },
  'anchor-block':  { pattern:/^\[#[^\]]+\]$/m,       alias:'symbol' },
  'url-block':     { pattern:/^https?:\/\/\S+$/m,    alias:'url' },
  'inline-link':   { pattern:/\[https?:\/\/[^\s\]]+\s[^\]]+\]/, alias:'url' },
  'footnote':      { pattern:/\[\^[^\]]+\]/,         alias:'symbol' },
  'anchor-ref':    { pattern:/\[#[^\]]+\]/,          alias:'symbol' },
  'bold':    { pattern:/\*\*[^*]+\*\*/ },
  'italic':  { pattern:/\*[^*]+\*/ },
  'ins':     { pattern:/\+\+[^+]+\+\+/, alias:'inserted' },
  'del':     { pattern:/~~[^~]+~~/,     alias:'deleted' },
  'code-inline': { pattern:/`[^`]+`/,   alias:'code' },
  'ol': { pattern:/^\s*\d+\.\s+.+$/m, inside:{ 'ol-marker':{ pattern:/^\s*\d+\.\s+/, alias:'punctuation' } } },
  'ul': { pattern:/^\s*- .+$/m,        inside:{ 'ul-marker':{ pattern:/^\s*- /, alias:'punctuation' } } },
};

// ============================================================
// Blogable Parser v1.1-alpha
// ============================================================

// ---- 定数 ----
const IMAGE_EXTS = /\.(jpe?g|png|gif|webp|avif)(\?.*)?$/i; // SVG除外

const SHEBANG_LANG_MAP = {
  python:'python', python3:'python', python2:'python',
  node:'javascript', nodejs:'javascript',
  ruby:'ruby', perl:'perl',
  bash:'bash', sh:'bash', zsh:'bash',
  php:'php', lua:'lua',
  blogable:'blogable',
  ebnf:'ebnf',
};

// ---- ユーティリティ ----
function slugify(text) {
  return text.trim().toLowerCase()
    .replace(/\s+/g,'-')
    .replace(/[^\w\u3000-\u9fff\u3040-\u309f\u30a0-\u30ff\uff00-\uffef-]/g,'')
    .replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function isImageUrl(url) { try { return IMAGE_EXTS.test(new URL(url).pathname); } catch { return IMAGE_EXTS.test(url); } }
function getHostname(url) { try { return new URL(url).hostname; } catch { return url; } }
function isSafeUrl(url) { return /^https:\/\//.test(url); }
function esc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function extLink(href,text) { return `<a href="${esc(href)}" rel="noopener noreferrer" target="_blank">${text}</a>`; }
function detectLang(line) {
  const m = line.match(/^#!(?:\/\S+\/(?:env\s+)?)(\S+)/);
  if (!m) return '';
  const cmd = m[1].replace(/[0-9.]+$/,'');
  return SHEBANG_LANG_MAP[cmd] || cmd;
}

function buildAttrs(mods) {
  const attrs={}, da=[];
  for (const {key,value} of mods) {
    if (key==='class') attrs.class=esc(value);
    if (key==='id')    attrs.id=esc(value);
    if (/^x-[a-z0-9-]+$/.test(key)) da.push(`data-${esc(key.slice(2))}="${esc(value)}"`);
  }
  return Object.entries(attrs).map(([k,v])=>` ${k}="${v}"`).join('')+(da.length?' '+da.join(' '):'');
}

// ---- OGP ----
const ogpMap={}, fetchedUrls=new Set();
async function fetchOgpTitle(url) {
  try {
    const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,{signal:AbortSignal.timeout(5000)});
    if (!res.ok) throw new Error();
    const data=await res.json();
    const html=data.contents||'';
    const m=html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i)
           ||html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i)
           ||html.match(/<title[^>]*>([^<]+)<\/title>/i);
    return m?m[1].trim():null;
  } catch { return null; }
}
async function fetchNewOgps(src) {
  const urls=[...new Set(src.split('\n').map(l=>l.trim()).filter(l=>/^https?:\/\/\S+$/.test(l)&&!isImageUrl(l)))].filter(u=>!fetchedUrls.has(u));
  if (!urls.length) return false;
  urls.forEach(u=>fetchedUrls.add(u));
  const results=await Promise.all(urls.map(async u=>({u,t:await fetchOgpTitle(u)})));
  let updated=false;
  for (const {u,t} of results) { if(t){ogpMap[u]=t;updated=true;} }
  const el=document.getElementById('ogp-status');
  const count=Object.keys(ogpMap).length;
  el.style.display=count>0?'inline':'none';
  el.textContent=`OGP: ${count}件取得済`;
  return updated;
}

// ---- インライン ----
let footnotes=[];
// ヘッドのIDマップ（内部アンカー解決用）
let headingIds={};

function parseInline(text) {
  return esc(text)
    // コード（最優先）
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // リンク
    .replace(/\[(https?:\/\/[^\s\]]+)\s+([^\]]+)\]/g, (_,url,label)=>{
      if (!isSafeUrl(url)) return esc(label);
      return extLink(url, label);
    })
    // 脚注
    .replace(/\[\^(https?:\/\/[^\s\]]+)\s+([^\]]+)\]/g, (_,url,alt)=>{
      if (!isSafeUrl(url)) return esc(url);
      const n=footnotes.length+1; footnotes.push({n,url,text:alt});
      return `<sup><a href="#fn-${n}" id="fnref-${n}">[${n}]</a></sup>`;
    })
    .replace(/\[\^\s*([^\]]+)\]/g, (_,text)=>{
      const n=footnotes.length+1; footnotes.push({n,url:null,text});
      return `<sup><a href="#fn-${n}" id="fnref-${n}">[${n}]</a></sup>`;
    })
    // 内部アンカー参照
    .replace(/\[#([^\]]+)\]/g, (_,id)=>{
      const slug=slugify(id);
      return `<a href="#${esc(slug)}" class="anchor-ref">${esc(id)}</a>`;
    })
    // strong / em
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    // del（~~ に変更）
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    // ins
    .replace(/\+\+([^+]+)\+\+/g, '<ins>$1</ins>');
}

// ============================================================
// tokenize
// ============================================================
function tokenize(lines) {
  const tokens=[];
  let mode=null; // null | 'shebang' | 'quote' | 'math' | 'front'

  for (const raw of lines) {
    const t=raw.trim();

    // フロントマター
    if (mode==='front') {
      if (t==='@@') { tokens.push({type:'front_close'}); mode=null; }
      else           { tokens.push({type:'front_line', text:t}); }
      continue;
    }
    // シバン内
    if (mode==='shebang') {
      if (t==='!#') { tokens.push({type:'shebang_close'}); mode=null; }
      else           { tokens.push({type:'code_line', text:raw}); }
      continue;
    }
    // 引用ブロック内
    if (mode==='quote') {
      if (t==='<|') { tokens.push({type:'quote_close'}); mode=null; }
      else           { tokens.push({type:'quote_line', text:t, empty:t===''}); }
      continue;
    }
    // 数式ブロック内
    if (mode==='math') {
      if (t==='$$') { tokens.push({type:'math_close'}); mode=null; }
      else           { tokens.push({type:'math_line', text:raw}); }
      continue;
    }

    // ---- トップレベル ----
    if (t==='')    { tokens.push({type:'empty'}); continue; }
    if (t==='@@')  { tokens.push({type:'front_open'}); mode='front'; continue; }
    if (t==='---') { tokens.push({type:'hr'}); continue; }
    if (t==='|>')  { tokens.push({type:'quote_open'}); mode='quote'; continue; }
    if (t==='$$')  { tokens.push({type:'math_open'}); mode='math'; continue; }

    // 修飾キー @[key: value]
    const modM=t.match(/^@\[([a-z][a-z0-9-]*):\s*(.*)\]$/);
    if (modM) { tokens.push({type:'modifier', key:modM[1], value:modM[2]}); continue; }

    // シバン開始
    if (t.startsWith('#!')) {
      const lang=detectLang(t);
      tokens.push({type:'shebang_open', lang, shebangLine:t});
      mode='shebang'; continue;
    }

    // 連番見出し ::# :::# ...
    const numH=t.match(/^(:{2,6})#\s+(.*)/);
    if (numH) { tokens.push({type:'heading', colons:numH[1].length, numbered:true,  text:numH[2]}); continue; }

    // 通常見出し :: ::: ...
    const plnH=t.match(/^(:{2,6})\s+(.*)/);
    if (plnH) { tokens.push({type:'heading', colons:plnH[1].length, numbered:false, text:plnH[2]}); continue; }

    // 1行引用
    if (t.startsWith('> ')) { tokens.push({type:'bq_inline', text:t.slice(2)}); continue; }

    // := 定義ブロック（行頭）
    const defM=t.match(/^:=\s+(.*)/);
    if (defM) { tokens.push({type:'def_term', text:defM[1]}); continue; }

    // 内部アンカーブロック [#text]
    const anchorM=t.match(/^\[#([^\]]+)\]$/);
    if (anchorM) { tokens.push({type:'anchor_block', id:slugify(anchorM[1]), label:anchorM[1]}); continue; }

    // タスクリスト
    const taskM=t.match(/^[#-]\s+\[([ x])\]\s+(.*)/i);
    if (taskM) { tokens.push({type:'task', checked:taskM[1].toLowerCase()==='x', text:taskM[2]}); continue; }

    // ul: - item
    if (/^\s*-\s+/.test(raw) && !raw.trim().startsWith('-[')) {
      const indent=raw.match(/^(\s*)/)[1].length;
      tokens.push({type:'ul', indent, text:t.replace(/^-\s+/,'')}); continue;
    }

    // ol: 1. item  2. item など
    const olM=raw.match(/^(\s*)(\d+)\.\s+(.*)/);
    if (olM) { tokens.push({type:'ol', indent:olM[1].length, text:olM[3]}); continue; }

    // URL単独行
    if (/^https?:\/\/\S+$/.test(t)) { tokens.push({type:'url', url:t}); continue; }

    // 通常テキスト
    tokens.push({type:'text', text:t});
  }
  return tokens;
}

// ============================================================
// buildAST
// ============================================================
function buildAST(tokens) {
  const nodes=[]; let i=0;

  function cm() { const mods=[]; while(i<tokens.length&&tokens[i].type==='modifier') mods.push(tokens[i++]); return mods; }

  function parseListItems(baseIndent, listType) {
    const items=[];
    while (i<tokens.length) {
      const tok=tokens[i];
      if (tok.type==='task' && listType==='task') {
        i++;
        items.push({listType:'task', checked:tok.checked, text:tok.text, children:null});
      } else if ((tok.type==='ul'||tok.type==='ol') && tok.type===listType && tok.indent===baseIndent) {
        i++;
        const item={listType, text:tok.text, children:null};
        if (i<tokens.length) {
          const next=tokens[i];
          if ((next.type==='ul'||next.type==='ol') && next.indent>baseIndent)
            item.children=parseListItems(next.indent, next.type);
        }
        items.push(item);
      } else break;
    }
    return items;
  }

  function renderListItems(items) {
    if (!items?.length) return '';
    const isTask=items[0].listType==='task';
    const isOl=items[0].listType==='ol';
    const tag=isOl?'ol':'ul';
    let h=`<${tag}>\n`;
    for (const item of items) {
      if (isTask) {
        h+=`  <li class="task-item"><input type="checkbox" disabled${item.checked?' checked':''}> ${parseInline(item.text)}</li>\n`;
      } else {
        h+=`  <li>${parseInline(item.text)}`;
        if (item.children) h+='\n'+renderListItems(item.children).split('\n').map(l=>'  '+l).join('\n')+'\n  ';
        h+=`</li>\n`;
      }
    }
    return h+`</${tag}>`;
  }

  // フロントマターパース
  function parseFrontLines(lines) {
    const meta={};
    for (const line of lines) {
      const m=line.match(/^([a-z][a-z0-9-]*):\s*(.*)/i);
      if (m) meta[m[1]]=m[2];
    }
    return meta;
  }

  while (i<tokens.length) {
    const tok=tokens[i];
    if (tok.type==='empty') { i++; continue; }

    // フロントマター
    if (tok.type==='front_open') {
      i++;
      const lines=[];
      while (i<tokens.length && tokens[i].type!=='front_close') lines.push(tokens[i++].text||'');
      if (tokens[i]?.type==='front_close') i++;
      nodes.push({type:'frontmatter', meta:parseFrontLines(lines)});
      continue;
    }

    if (tok.type==='hr') { i++; nodes.push({type:'hr'}); continue; }

    // 見出し
    if (tok.type==='heading') {
      i++;
      const mods=cm();
      const id=slugify(tok.text);
      headingIds[id]=true;
      nodes.push({type:'heading', level:tok.colons, id, label:tok.text, numbered:tok.numbered, attrs:buildAttrs(mods)});
      continue;
    }

    // 1行引用
    if (tok.type==='bq_inline') { i++; nodes.push({type:'blockquote_inline', html:parseInline(tok.text)}); continue; }

    // 引用ブロック
    if (tok.type==='quote_open') {
      i++;
      const lineGroups=[[]];
      while (i<tokens.length && tokens[i].type!=='quote_close') {
        const t=tokens[i++];
        if (t.type==='quote_line') {
          if (t.empty) lineGroups.push([]);
          else lineGroups[lineGroups.length-1].push(t.text);
        }
      }
      if (tokens[i]?.type==='quote_close') i++;
      const mods=cm();
      nodes.push({
        type:'blockquote_block',
        paragraphs:lineGroups.filter(g=>g.length>0).map(g=>g.map(l=>parseInline(l)).join('<br>')),
        cite:mods.find(m=>m.key==='cite')?.value||'',
        author:mods.find(m=>m.key==='author')?.value||''
      });
      continue;
    }

    // 数式ブロック
    if (tok.type==='math_open') {
      i++;
      const lines=[];
      while (i<tokens.length && tokens[i].type!=='math_close') lines.push(tokens[i++].text||'');
      if (tokens[i]?.type==='math_close') i++;
      nodes.push({type:'math', lines});
      continue;
    }

    // := 定義ブロック（term + 後続テキスト行がDD）
    if (tok.type==='def_term') {
      i++;
      const term=tok.text;
      // 後続の非空テキスト行を定義本文（DD）として収集
      const ddLines=[];
      while (i<tokens.length) {
        const t=tokens[i];
        if (t.type==='empty') { i++; break; }
        if (t.type==='text')  { ddLines.push(t.text); i++; }
        else break;
      }
      nodes.push({type:'def_block', term, ddLines});
      continue;
    }

    // 内部アンカーブロック
    if (tok.type==='anchor_block') { i++; nodes.push({type:'anchor_block', id:tok.id, label:tok.label}); continue; }

    // コードブロック
    if (tok.type==='shebang_open') {
      const {lang, shebangLine}=tok; i++;
      const codeLines=[];
      while (i<tokens.length && tokens[i].type!=='shebang_close')
        codeLines.push(tokens[i++].type==='code_line'?tokens[i-1].text:'');
      if (tokens[i]?.type==='shebang_close') i++;
      const mods=cm();
      nodes.push({type:'codeblock', shebangLine, lang, lines:codeLines,
        title:mods.find(m=>m.key==='title')?.value||'',
        cite:mods.find(m=>m.key==='cite')?.value||''});
      continue;
    }

    // タスクリスト
    if (tok.type==='task') {
      const items=[];
      while (i<tokens.length && tokens[i].type==='task') {
        items.push({listType:'task', checked:tokens[i].checked, text:tokens[i].text}); i++;
      }
      nodes.push({type:'list', html:renderListItems(items)});
      continue;
    }

    // ul / ol
    if (tok.type==='ul'||tok.type==='ol') {
      const items=parseListItems(tok.indent, tok.type);
      nodes.push({type:'list', html:renderListItems(items)});
      continue;
    }

    // URL
    if (tok.type==='url') {
      const group=[];
      while (i<tokens.length && tokens[i].type==='url') {
        const url=tokens[i++].url; const mods=cm();
        group.push({url, mods});
      }
      const valid=group.filter(g=>isSafeUrl(g.url));
      if (valid.length>0 && valid.every(g=>isImageUrl(g.url))) {
        nodes.push({type:'figure', images:valid});
      } else {
        for (const g of valid) nodes.push({type:'autolink', url:g.url, label:ogpMap[g.url]||getHostname(g.url)});
      }
      continue;
    }

    // 通常テキスト
    if (tok.type==='text') {
      i++;
      while (i<tokens.length && tokens[i].type==='modifier') i++;
      nodes.push({type:'paragraph', html:parseInline(tok.text)});
      continue;
    }

    i++;
  }
  return nodes;
}

let cbCounter=0;

function astToHtml(nodes, forDisplay=false) {
  let html=nodes.map(node=>{
    switch(node.type) {

        const entries=Object.entries(node.meta);
        if (!entries.length) return '';
        let h='<dl class="front-matter">\n';
        for (const [k,v] of entries) h+=`  <dt>${esc(k)}</dt><dd>${esc(v)}</dd>\n`;
        return h+'</dl>';
      }

      case 'hr': return '<hr>';

      case 'heading': {
        const cls=node.numbered?' class="numbered"'+node.attrs:node.attrs;
        return `<h${node.level} id="${esc(node.id)}"${cls}>${esc(node.label)}</h${node.level}>`;
      }

      case 'blockquote_inline': return `<blockquote><p>${node.html}</p></blockquote>`;

      case 'blockquote_block': {
        const cu=isSafeUrl(node.cite);
        let h='<blockquote>\n';
        for (const p of node.paragraphs) h+=`  <p>${p}</p>\n`;
        if (node.cite||node.author) {
          h+='  <footer>\n';
          if (node.cite)   h+=`    <cite>${cu?extLink(node.cite,getHostname(node.cite)):esc(node.cite)}</cite>\n`;
          if (node.author) h+=`    <span class="author"> — ${esc(node.author)}</span>\n`;
          h+='  </footer>\n';
        }
        return h+'</blockquote>';
      }

      case 'math': {
        return `<div class="math-block">${node.lines.map(l=>esc(l)).join('\n')}</div>`;
      }

      case 'def_block': {
        const ddHtml=node.ddLines.map(l=>`<p>${parseInline(l)}</p>`).join('\n');
        return `<dl class="def-block"><dt>${parseInline(node.term)}</dt><dd>${ddHtml}</dd></dl>`;
      }

      case 'anchor_block': {
        return `<span class="anchor-block" id="${esc(node.id)}">[#${esc(node.label)}]</span>`;
      }

      case 'list': return node.html;

      case 'codeblock': {
        if (!forDisplay) {
          const allLines=[node.shebangLine,...node.lines];
          let h='<figure class="blogable-code">\n';
          if (node.title||node.lang) h+=`  <figcaption>${esc(node.title)}${node.lang?` <span class="lang-badge">${esc(node.lang)}</span>`:''}</figcaption>\n`;
          h+=`  <pre><code${node.lang?` class="language-${esc(node.lang)}"`:''}}>${allLines.map(l=>esc(l)).join('\n')}</code></pre>\n`;

      if (node.cite) h+=`  <cite>${isSafeUrl(node.cite)?extLink(node.cite,getHostname(node.cite)):esc(node.cite)}</cite>\n`;
      return h+'</figure>';

    const id=`cb-${++cbCounter}`;

    }).join('\n');
    let h=`<figure class="blogable-code" id="${id}">`;
    if (node.title||node.lang) h+=`<figcaption><span>${esc(node.title)}</span>${node.lang?`<span class="lang-badge">${esc(node.lang)}</span>`:''}</figcaption>`;
    h+=`<div class="code-area"><button class="copy-all-btn" onclick="copyAll('${id}')">copy</button><table class="code-table"><tbody>${rows}</tbody></table></div>`;

    h+='</figure>';
    window._cb=window._cb||{}; window._cb[id]=node;
    return h;
  }

  case 'figure': {
    const rev=[...node.images].reverse();
    const lt=rev.find(g=>g.mods.find(m=>m.key==='title'))?.mods.find(m=>m.key==='title')?.value;
    const lc=rev.find(g=>g.mods.find(m=>m.key==='cite'))?.mods.find(m=>m.key==='cite')?.value;
    let h='<figure class="blogable-figure">\n';
    for (const img of node.images) {
      const alt=img.mods.find(m=>m.key==='alt')?.value||'';
      const title=img.mods.find(m=>m.key==='title')?.value||'';
      const xAttrs=img.mods.filter(m=>/^x-[a-z0-9-]+$/.test(m.key)).map(m=>`data-${esc(m.key.slice(2))}="${esc(m.value)}"`).join(' ');

    return h+'</figure>';

async function copyAll(id){const node=window._cb?.[id];if(!node)return;await navigator.clipboard.writeText(node.lines.join(’\n’));const btn=document.querySelector(`#${id} .copy-all-btn`);if(!btn)return;btn.textContent=‘copied!’;btn.classList.add(‘copied’);setTimeout(()=>{btn.textContent=‘copy’;btn.classList.remove(‘copied’);},1500);}
async function copyLine(id,idx){const node=window._cb?.[id];if(!node)return;const allRows=[…(node.shebangLine?[{text:node.shebangLine}]:[]),…node.lines.map(text=>({text}))];await navigator.clipboard.writeText(allRows[idx]?.text??’’);const ln=document.getElementById(`${id}-ln-${idx}`);const lc=document.getElementById(`${id}-lc-${idx}`);if(ln){ln.classList.add(‘copied’);setTimeout(()=>ln.classList.remove(‘copied’),1500);}if(lc){lc.classList.add(‘copied’);setTimeout(()=>lc.classList.remove(‘copied’),1500);}}
