<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<header>

  <span class="version">parser v1.1-alpha</span>
  <span id="ogp-status"></span>
  <a class="github-link" href="https://github.com/worthmine/Blogable" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">
    <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    worthmine/Blogable
  </a>
</header>
<div class="main">
  <div class="pane pane-left">
    <div class="pane-label">SOURCE</div>
    <textarea id="source" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('preview',this)">PREVIEW</button>
      <button class="tab-btn"        onclick="switchTab('html',this)">HTML</button>
      <button class="tab-btn" id="diag-tab-btn" onclick="switchTab('diag',this)">DIAGNOSTICS</button>
    </div>
    <div class="output">
      <div id="preview-out" class="bp" style="line-height:1.9;font-size:15px;"></div>
      <pre id="html-out" style="display:none"></pre>
      <div id="diag-out" style="display:none"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

<script src="statics/Blogable.js"></script>

<script>
// Override demo source with English content
document.getElementById('source').value = `@@
title: Blogable v1.1-alpha Demo
author: worthmine(Yuki Yoshida)
x-version: 1.1-alpha
@@

:: Blogable v1.1-alpha Demo

---

:: Front Matter

The \`@@\` block above is the front matter. It is parsed and displayed as a metadata
list at the top of the document.

---

:: Headings

:: h2 Heading

::: h3 Heading

:::: h4 Heading

::# Numbered h2
:::# Numbered h3
:::# Numbered h3 (counter continues)

---

:: Paragraphs

A regular line of text becomes a paragraph.

---

:: Explicit Paragraph (ParaBlock)

: An explicit paragraph begins with ": " and accepts metadata modifiers.
@[class: lead]

---

:: Bullet List

- Item A
- Item B
  - Nested B-1
  - Nested B-2
- Item C

---

:: Ordered List

# First item
# Second item
# Third item

---

:: Task List

[x] Completed task
[ ] Open task
[x] Another completed task

---

:: Definition List

:= Deterministic
A parser is deterministic when the same input always produces the same output with no ambiguity.

:= Single-pass
Processing proceeds line by line in one forward pass — no lookahead or backtracking.

---

:: Horizontal Rule

---

:: Block Quote

> A single-line block quote.

|>
A multi-line block quote.
**Inline markup** works inside quotes too.

A blank line starts a new paragraph within the block.
<|
@[author: Author Name]
@[cite: Source Title]

---

:: Math Block

$$
E = mc^2
F = ma
$$

---

:: Inline Markup

**strong** *emphasis* \`inline code\` ++inserted++ ~~deleted~~

Link: [https://example.com link text]

Footnote with URL: [^https://example.com reference] [^ note without URL]

---

:: URL & Image

https://www.wikipedia.org/

https://picsum.photos/seed/blogable1/600/200.jpg
@[alt: Sample image]
@[title: Image caption]

---

:: Code Block (Blogable highlight demo)

#!blogable
:: h2 Heading
::: h3 Heading
:= Term
Definition body paragraph.

[x] Done task
[ ] Open task
  **bold** *italic* \`code\` ++ins++ ~~del~~
  [https://example.com link]
  @[class: lead]
  @[cite: https://example.com]
!#
@[title: Blogable syntax highlight]

---

:: EBNF Block (highlight demo)

#!ebnf
Document = [ FrontMatterBlock ] , { Block } ;
Block    = Heading | Paragraph | CodeBlock | QuoteBlock ;
Heading  = "::" , { ":" } , SP , InlineText , NL ;
!#
@[title: EBNF syntax highlight]

---

:: Internal Anchor

[#blogable-v11-alpha-demo]

Heading reference: [#Inline Markup]
`;
render();
fetchNewOgps(document.getElementById('source').value).then(u => {
  if (u) render();
  const el = document.getElementById('ogp-status');
  if (el) {
    const m = el.textContent.match(/(\d+)件/);
    el.textContent = m ? `URL labels: ${m[1]} generated` : 'URL labels: status unavailable';
  }
});
</script>

</body>
</html>
